
name: Build Hamrah Trader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'agent.js'
      - 'manifest.json'
      - 'sw.js'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Check application files
        run: |
          test -f index.html
          test -f agent.js
          test -f manifest.json
          test -f sw.js

      - name: Create Android project
        run: |
          cordova create app com.hamrahtrader.app "Hamrah Trader"
          cd app
          cordova platform add android

      - name: Copy application files
        run: |
          cp index.html app/www/index.html
          cp agent.js app/www/agent.js
          cp manifest.json app/www/manifest.json
          cp sw.js app/www/sw.js
          for d in assets css js; do
            if [ -d "$d" ]; then
              cp -r "$d" "app/www/"
            fi
          done

      - name: Build APK
        run: |
          cd app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamrah-Trader-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
