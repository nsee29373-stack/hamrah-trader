
name: Build Hamrah Trader APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'agent.js'
      - 'manifest.json'
      - 'sw.js'
      - 'account-connect.js'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android project
        run: cordova create app com.hamrahtrader.app "Hamrah Trader"

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android

      - name: Copy application files
        run: |
          test -f index.html
          test -f account-connect.js
          cp index.html app/www/index.html
          cp account-connect.js app/www/account-connect.js
          [ ! -f agent.js ] || cp agent.js app/www/agent.js
          [ ! -f manifest.json ] || cp manifest.json app/www/manifest.json
          [ ! -f sw.js ] || cp sw.js app/www/sw.js
          [ ! -d assets ] || cp -R assets app/www/
          [ ! -d css ] || cp -R css app/www/
          [ ! -d js ] || cp -R js app/www/

      - name: Build APK
        working-directory: app
        run: cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamrah-Trader-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
